name: Generate Contribution Visualizations

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allows manual trigger from Actions tab
  workflow_dispatch:
  # Run on pushes to main
  push:
    branches:
      - main

jobs:
  generate-visuals:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Happy-Kumar-Sharma
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D Contribution Skyline
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Happy-Kumar-Sharma

      - name: Commit & Push 3D Contribution Graphs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No 3D changes to commit"
          else
            git commit -m "chore(telemetry): update 3d contribution skyline [skip ci]"
            git push
          fi
